# Render production stack.
#
# Create the stack once with:
#   pulumi stack init nbaghiro-org/render-prod
# then set the two provider credentials (never commit them in plain text):
#   pulumi config set --secret render:apiKey <render-api-key>
#   pulumi config set render:ownerId tea-xxxxxxxxxxxxxxxxxxxx
# and the secret values with:
#   ./infra/scripts/export-secrets-to-pulumi.sh --stack nbaghiro-org/render-prod
#
# Every key below is documented next to its placeholder. Keys marked "secret"
# must be set with `pulumi config set --secret`, which stores them encrypted in
# Pulumi Cloud, so this file only ever holds ciphertext for them.
config:
  # Platform switch read by index.ts
  flowmaestro-infrastructure:platform: render
  # Shared application settings (same keys as the GCP stack)
  flowmaestro-infrastructure:appName: flowmaestro
  flowmaestro-infrastructure:environment: production
  flowmaestro-infrastructure:domain: flowmaestro.ai
  flowmaestro-infrastructure:temporalNamespace: default
  # Secret definitions: copy the JSON array from Pulumi.production.yaml
  # (flowmaestro-infrastructure:secrets). The list is the source of truth for
  # which ENV_VARs exist, their category and which process receives them.
  # flowmaestro-infrastructure:secrets: '[...]'

  # Secret values (secret): an object keyed by ENV_VAR, filled by
  # infra/scripts/export-secrets-to-pulumi.sh. Example of setting one by hand:
  #   pulumi config set --secret --path "secretValues.RESEND_API_KEY" -- "<value>"
  # flowmaestro-infrastructure:secretValues: {}

  # Optional secrets (secret)
  #   gcsServiceAccountJson: contents of the GCS service account key file,
  #     mounted into api and worker at /etc/secrets/gcs-service-account.json
  #   temporalCloudApiKey: only when render.temporalMode is "cloud"
  # flowmaestro-infrastructure:gcsServiceAccountJson: ""
  # flowmaestro-infrastructure:temporalCloudApiKey: ""

  # Render platform settings. Defaults are in src/platforms/render/config.ts;
  # only keys that differ need to be listed.
  flowmaestro-infrastructure:render:
    # frankfurt | ohio | oregon | singapore | virginia
    region: oregon
    # The Render project "FlowMaestro" and its "Production" environment were
    # created in the dashboard. Pulumi attaches every resource to this
    # environment and never creates a project. Ids from
    # `render projects list -o json` and `render environments list -o json`.
    projectId: prj-dao6phegekts73b3qrmg
    environmentId: evm-dao6phegekts73b3qrn0
    projectName: FlowMaestro
    # Backend image published by the GHCR workflow (public package)
    image: ghcr.io/nbaghiro/flowmaestro-backend
    # Set to the git sha to deploy, e.g. via
    #   pulumi config set --path render.imageTag $(git rev-parse --short HEAD)
    imageTag: latest
    # Instance plans: starter (512 MB), standard (2 GB), pro (4 GB), ...
    apiPlan: starter
    workerPlan: starter
    temporalPlan: starter
    temporalUiEnabled: false
    temporalUiPlan: starter
    # Postgres: basic_256mb | basic_1gb | basic_4gb | pro_4gb ...; version 15
    postgresPlan: basic_256mb
    postgresVersion: "15"
    # Key Value: free (25 MB, no persistence) | starter | standard ...
    keyvaluePlan: free
    keyvalueMaxMemoryPolicy: allkeys_lru
    # self-hosted: a private service running temporalio/auto-setup
    # cloud: no service; set temporalCloudAddress, temporalCloudNamespace
    #        and the temporalCloudApiKey secret
    temporalMode: self-hosted
    temporalImage: docker.io/temporalio/auto-setup
    temporalImageTag: "1.23.0"
    temporalDbName: temporal
    temporalVisibilityDbName: temporal_visibility
    temporalHistoryShards: 4
    # temporalCloudAddress: <namespace>.<account>.tmprl.cloud:7233
    # temporalCloudNamespace: <namespace>.<account>

    # Static sites are built by Render from the repository (needs the
    # Render GitHub app installed on the repository)
    repoUrl: https://github.com/nbaghiro/flowmaestro
    branch: main
    staticSitesEnabled: true
    # Extra build-time variables for the sites (public values only)
    staticSiteEnv:
      VITE_GA_MEASUREMENT_ID: ""
      VITE_POSTHOG_KEY: ""
      VITE_POSTHOG_HOST: ""
    # Leave false until the DNS records from `pulumi stack output outputs`
    # (dnsRecords) exist; then set true and run `pulumi up` again
    customDomainsEnabled: false
    # GCS buckets stay on GCP; names from the production stack outputs
    gcsUploadsBucket: flowmaestro-uploads-flowmaestro-prod
    gcsArtifactsBucket: flowmaestro-artifacts-flowmaestro-prod
    gcsKnowledgeDocsBucket: flowmaestro-knowledge-docs-flowmaestro-prod
    gcsInterfaceDocsBucket: flowmaestro-interface-docs-flowmaestro-prod
  # Provider credentials (bridged provider namespace). ownerId is the
  # workspace id from `render workspace current`.
  # render:apiKey: (secret) set with `pulumi config set --secret render:apiKey ...`
  render:ownerId: tea-d9an6ofavr4c73alddjg
