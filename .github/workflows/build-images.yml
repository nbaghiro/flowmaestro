# Build and publish the backend image to GitHub Container Registry.
#
# The image is shared by the api (default CMD) and the Temporal worker
# (command override: node backend/dist/backend/src/temporal/worker.js) and
# carries the database migrations, so hosted platforms such as Render can pull
# it directly and run `npm run db:migrate:prod` as a pre-deploy step.
#
# One-time setup: GHCR creates new packages as private. After the first push,
# open https://github.com/users/nbaghiro/packages/container/flowmaestro-backend/settings
# and set the visibility to Public so that Render can pull without a credential.
name: Build Images

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - "shared/**"
            - "sdks/ai-sdk/**"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.base.json"
            - "infra/docker/backend/Dockerfile"
            - ".github/workflows/build-images.yml"
    workflow_dispatch:
        inputs:
            tag:
                description: "Extra image tag to apply (for example v1.2.0)"
                required: false
                default: ""

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/nbaghiro/flowmaestro-backend

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              run: |
                  SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
                  TAGS="${IMAGE}:${SHORT_SHA},${IMAGE}:latest"
                  if [ -n "${{ github.event.inputs.tag }}" ]; then
                    TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.tag }}"
                  fi
                  echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
                  echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: infra/docker/backend/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

            # Render deploy hooks. Enable once the Render services exist and their
            # deploy hook URLs are stored as repository secrets. Each hook redeploys
            # one service with the image tag it is configured to track (`latest`).
            #
            # - name: Trigger Render deploys
            #   if: github.event_name == 'push'
            #   run: |
            #     curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
            #     curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
